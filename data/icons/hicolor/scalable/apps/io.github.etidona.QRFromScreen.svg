<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="glow" x1="0" y1="18" x2="0" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#99c1f1" stop-opacity="0"/>
      <stop offset="1" stop-color="#99c1f1" stop-opacity="0.7"/>
    </linearGradient>
    <clipPath id="scanned">
      <rect x="14" y="18" width="100" height="38"/>
    </clipPath>
    <!-- Stylised QR code on a 4px module grid -->
    <path id="qr" d="M32 24h28v28h-28zM36 28v20h20v-20zM40 32h12v12h-12zM68 24h28v28h-28zM72 28v20h20v-20zM76 32h12v12h-12zM32 60h28v28h-28zM36 64v20h20v-20zM40 68h12v12h-12z
             M68 60h4v4h-4zM76 60h8v4h-8zM88 60h4v4h-4zM72 64h4v4h-4zM84 64h12v4h-12zM68 68h8v4h-8zM80 68h4v4h-4zM92 68h4v4h-4zM76 72h4v4h-4zM84 72h4v4h-4zM92 72h4v4h-4zM68 76h4v4h-4zM76 76h8v4h-8zM92 76h4v4h-4zM72 80h4v4h-4zM84 80h8v4h-8zM68 84h8v4h-8zM80 84h4v4h-4zM88 84h8v4h-8z"/>
  </defs>
  <!-- Stand -->
  <rect x="54" y="100" width="20" height="12" fill="#241f31"/>
  <rect x="38" y="108" width="52" height="10" rx="4" fill="#241f31"/>
  <rect x="38" y="108" width="52" height="6" rx="3" fill="#5e5c64"/>
  <!-- Monitor: side (thickness), top rim and face -->
  <rect x="8" y="12" width="112" height="94" rx="10" fill="#241f31"/>
  <rect x="8" y="12" width="112" height="88" rx="10" fill="#5e5c64"/>
  <rect x="8" y="13" width="112" height="87" rx="10" fill="#3d3846"/>
  <!-- Screen -->
  <rect x="14" y="18" width="100" height="76" rx="4" fill="#f6f5f4"/>
  <!-- QR code -->
  <use href="#qr" fill="#241f31"/>
  <!-- Scan: beam trail, scanned modules, scan line -->
  <rect x="14" y="18" width="100" height="38" fill="url(#glow)"/>
  <use href="#qr" fill="#1a5fb4" clip-path="url(#scanned)"/>
  <rect x="18" y="56" width="92" height="4" rx="2" fill="#3584e4"/>
</svg>
